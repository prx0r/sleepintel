# === SHELF CONFIGURATION ===
shelves:
  SPIRITUAL:
    primary_voice: V01
    fallback_voices: [V04, V08, V09]
    accent: '#D4A94E'
  
  ESOTERIC:
    primary_voice: V04
    fallback_voices: [V01, V06, V09]
    accent: '#7A6FF0'
  
  STORY:
    primary_voice: V02
    fallback_voices: [V07, V10, V05]
    accent: '#C9A227'
  
  MIND:
    primary_voice: V03
    fallback_voices: [V07, V10, V06]
    accent: '#2E8B8B'
  
  MUSIC:
    primary_voice: V01  # Host voice for music channels
    fallback_voices: [V02, V10]
    accent: '#D4A94E'
  
  PLACE:
    primary_voice: null  # No narration for ambience
    fallback_voices: []
    accent: null
  
  FRESH:
    primary_voice: V05
    fallback_voices: [V10, V02]
    accent: '#FF6B6B'
